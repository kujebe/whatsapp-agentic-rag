services:
  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-whatsapp}-redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --loglevel warning
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      mesh:
        aliases:
          - redis
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
        reservations:
          cpus: "0.10"
          memory: 128M

  baileys:
    build:
      context: ./services/baileys-bridge
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-whatsapp}-baileys
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/whatsapp-inbound
      - DEBOUNCE_MS=${DEBOUNCE_MS:-3500}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TENANT_ID=${TENANT_ID:-default}
    volumes:
      - baileys_auth:/app/auth_info_baileys
      - whatsapp_media:/app/media
    ports:
      - "127.0.0.1:${BAILEYS_HOST_PORT:-3000}:3000"
    networks:
      mesh:
        aliases:
          - baileys
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.20"
          memory: 256M

  n8n:
    image: n8nio/n8n:2.23.4
    container_name: ${COMPOSE_PROJECT_NAME:-whatsapp}-n8n
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_PUBLIC_WEBHOOK_URL:-http://localhost:${N8N_HOST_PORT:-5678}/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Lagos}
      - NODE_ENV=production
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - DB_SQLITE_VACUUM_ON_STARTUP=false
      - DB_SQLITE_BUSY_TIMEOUT=10000
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path,crypto
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_GRANT_TOKEN_TTL=120
      - N8N_RUNNERS_TASK_REQUEST_TIMEOUT=60
      - N8N_RUNNERS_TASK_TIMEOUT=120
      - TENANT_ID=${TENANT_ID:-default}
      - TENANT_CATALOG_PATH=/data/clients/${TENANT_ID:-default}/data/catalog.json
      - TENANT_FAQ_PATH=/data/clients/${TENANT_ID:-default}/data/faq.json
      - TENANT_CONFIG_PATH=/data/clients/${TENANT_ID:-default}/data/config.json
      - SALES_REP_JID=${SALES_REP_JID:-}
      - EOD_CRON_WAT=${EOD_CRON_WAT:-0 19 * * 1-6}
      - LLM_BASE_URL=
      - LLM_MODEL=Qwen/Qwen2.5-7B-Instruct
      - LLM_API_KEY=
      - MODAL_VISION_URL=
      - MODAL_WHISPER_URL=
    volumes:
      - n8n_data:${N8N_DIR:-/home/node}/.n8n
      - whatsapp_media:/data/media
      - ./clients:/data/clients:ro
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    networks:
      mesh:
        aliases:
          - n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M

networks:
  mesh:
    name: ${COMPOSE_PROJECT_NAME:-whatsapp}-mesh
    driver: bridge

volumes:
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-whatsapp}_redis_data
  baileys_auth:
    name: ${COMPOSE_PROJECT_NAME:-whatsapp}_baileys_auth
  whatsapp_media:
    name: ${COMPOSE_PROJECT_NAME:-whatsapp}_media
  n8n_data:
    name: ${N8N_EXISTING_VOLUME:-${COMPOSE_PROJECT_NAME:-whatsapp}_n8n_data}
